services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegisops
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops -d aegisops"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  telemetry-service:
    build:
      context: ../../apps/telemetry-service
    ports:
      - "127.0.0.1:8081:8081"
  incident-service:
    build:
      context: ../../apps/incident-service
    ports:
      - "127.0.0.1:8082:8082"
  ml-service:
    build:
      context: ../../apps/ml-service
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  postgres_data:
